  <style>
    :root {
      --ink: #082f49;
      --navy: #082f49;
      --blue: #075985;
      --gold: #fbbf24;
      --coral: #f05252;
      --cream: #fffdf5;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: #082f49;
    }

    .game-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(circle at 8% 5%, rgba(251, 191, 36, .25), transparent 23rem),
        radial-gradient(circle at 95% 14%, rgba(240, 82, 82, .2), transparent 20rem),
        linear-gradient(145deg, #082f49 0%, #075985 54%, #0c4a6e 100%);
    }

    .dot-pattern {
      background-image: radial-gradient(rgba(255,255,255,.16) 1.1px, transparent 1.1px);
      background-size: 17px 17px;
    }

    .game-card {
      box-shadow: 0 18px 46px rgba(3, 27, 47, .22);
    }

    .round-tab {
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }

    .round-tab:hover { transform: translateY(-2px); }

    .round-tab.is-active {
      background: #fbbf24;
      color: #082f49;
      box-shadow: 0 5px 0 #d97706;
    }

    .question-panel {
      display: none;
      animation: rise .35s ease both;
    }

    .question-panel.is-active { display: block; }

    .answer-tile {
      min-height: 61px;
      transition: transform .18s ease, box-shadow .18s ease, background .25s ease;
    }

    .answer-tile:hover:not(:disabled) {
      transform: translateX(4px);
      box-shadow: 0 8px 18px rgba(8, 47, 73, .12);
    }

    .answer-tile:focus-visible,
    .round-tab:focus-visible,
    .action-button:focus-visible {
      outline: 3px solid #fbbf24;
      outline-offset: 3px;
    }

    .answer-cover { display: flex; }
    .answer-reveal { display: none; }

    .answer-tile.is-open {
      background: #fff7d6;
      border-color: #fbbf24;
      cursor: default;
    }

    .answer-tile.is-open .answer-cover { display: none; }
    .answer-tile.is-open .answer-reveal { display: flex; }

    .answer-tile.is-open .answer-index {
      background: #fbbf24;
      color: #082f49;
    }

    .score-pop { animation: pop .3s ease both; }

    #wrong-answer.is-wrong {
      animation: wrong-shake .42s ease both;
      background: #dc2626;
    }

    #wrong-answer.is-wrong svg {
      color: #fecaca;
      animation: wrong-icon-pop .42s ease both;
    }

    .wrong-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(8, 47, 73, .58);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .wrong-overlay.is-visible {
      opacity: 1;
    }

    .wrong-overlay-mark {
      display: grid;
      place-items: center;
      width: min(42vw, 210px);
      height: min(42vw, 210px);
      border: 10px solid #fecaca;
      border-radius: 999px;
      background: #dc2626;
      color: #fff;
      box-shadow: 0 18px 50px rgba(127, 29, 29, .45);
      animation: wrong-overlay-pop .45s cubic-bezier(.2,.8,.2,1) both;
    }

    .wrong-overlay-mark svg {
      width: 62%;
      height: 62%;
      stroke-width: 3.5;
    }

    @keyframes wrong-overlay-pop {
      0% { transform: scale(.35) rotate(-12deg); opacity: 0; }
      65% { transform: scale(1.08) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(.9); }
      65% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    @keyframes wrong-icon-pop {
      0% { transform: scale(.7) rotate(-12deg); }
      60% { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @media (max-width: 640px) {
      .answer-tile { min-height: 58px; }
    }
  </style>

  <script>
    let totalScore = 0;
    let activeRound = "1";

    const scoreOutput = document.getElementById("total-score");
    const panels = document.querySelectorAll(".question-panel");
    const tabs = document.querySelectorAll(".round-tab");

    function updateScore() {
      scoreOutput.textContent = totalScore;
      scoreOutput.classList.remove("score-pop");
      void scoreOutput.offsetWidth;
      scoreOutput.classList.add("score-pop");
    }

    function showRound(round) {
      activeRound = round;
      panels.forEach(panel => panel.classList.toggle("is-active", panel.dataset.question === round));
      tabs.forEach(tab => {
        const selected = tab.dataset.round === round;
        tab.classList.toggle("is-active", selected);
        tab.setAttribute("aria-current", selected ? "true" : "false");
      });
    }

    function resetTiles(scope) {
      let removedPoints = 0;
      scope.querySelectorAll(".answer-tile.is-open").forEach(tile => {
        removedPoints += Number(tile.dataset.points);
        tile.classList.remove("is-open");
        tile.disabled = false;
        tile.setAttribute("aria-pressed", "false");
      });
      return removedPoints;
    }

    document.querySelectorAll(".answer-tile").forEach(tile => {
      tile.setAttribute("aria-pressed", "false");
      tile.addEventListener("click", () => {
        if (tile.classList.contains("is-open")) return;
        tile.classList.add("is-open");
        tile.disabled = true;
        tile.setAttribute("aria-pressed", "true");
        totalScore += Number(tile.dataset.points);
        updateScore();
      });
    });

    tabs.forEach(tab => {
      tab.addEventListener("click", () => showRound(tab.dataset.round));
    });

    document.getElementById("wrong-answer").addEventListener("click", () => {
      const wrongButton = document.getElementById("wrong-answer");
      const wrongOverlay = document.getElementById("wrong-overlay");
      wrongOverlay.classList.remove("is-visible");
      void wrongOverlay.offsetWidth;
      wrongOverlay.classList.add("is-visible");
      wrongOverlay.setAttribute("aria-hidden", "false");
      window.setTimeout(() => {
        wrongOverlay.classList.remove("is-visible");
        wrongOverlay.setAttribute("aria-hidden", "true");
      }, 900);
      wrongButton.classList.remove("is-wrong");
      void wrongButton.offsetWidth;
      wrongButton.classList.add("is-wrong");
      window.setTimeout(() => wrongButton.classList.remove("is-wrong"), 450);

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      const audioContext = new AudioContextClass();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(180, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(90, audioContext.currentTime + 0.22);
      gain.gain.setValueAtTime(0.12, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.22);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.22);
      oscillator.addEventListener("ended", () => audioContext.close(), { once: true });
    });

    document.getElementById("reset-round").addEventListener("click", () => {
      const activePanel = document.querySelector('.question-panel[data-question="' + activeRound + '"]');
      totalScore = Math.max(0, totalScore - resetTiles(activePanel));
      updateScore();
    });

    document.getElementById("reset-all").addEventListener("click", () => {
      document.querySelectorAll(".answer-tile").forEach(tile => {
        tile.classList.remove("is-open");
        tile.disabled = false;
        tile.setAttribute("aria-pressed", "false");
      });
      totalScore = 0;
      updateScore();
      showRound("1");
    });

    lucide.createIcons();
  </script>
